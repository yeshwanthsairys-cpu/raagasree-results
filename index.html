
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raagasree E.M High School | Student Results</title>

  <style>
    :root {
      --navy: #101d3a;
      --navy-light: #1c3158;
      --gold: #d9a441;
      --gold-light: #f4d58a;
      --white: #ffffff;
      --bg: #f4f6fa;
      --text: #263247;
      --muted: #748096;
      --border: #e5e9f0;
      --green: #18865b;
      --red: #c53c46;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      height: 7px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
    }

    header {
      background: var(--navy);
      color: white;
      text-align: center;
      padding: 32px 15px 28px;
      border-bottom: 4px solid var(--gold);
    }

    .logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      font-family: Georgia, serif;
      font-size: 35px;
      font-weight: bold;
    }

    .welcome {
      color: var(--gold-light);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 7px;
    }

    header h1 {
      margin: 0;
      color: var(--gold-light);
      font-family: Georgia, serif;
      font-size: clamp(30px, 6vw, 46px);
      letter-spacing: 2px;
    }

    header h2 {
      margin: 5px 0 0;
      font-size: 16px;
      letter-spacing: 3px;
      font-weight: 600;
    }

    .location {
      margin-top: 7px;
      font-size: 13px;
      color: #d9dfeb;
      letter-spacing: 2px;
    }

    .tagline {
      margin-top: 15px;
      color: var(--gold-light);
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 15px;
    }

    main {
      width: min(950px, 92%);
      margin: 32px auto 50px;
    }

    .login-card, .results-card {
      background: white;
      border-radius: 15px;
      padding: 28px;
      box-shadow: 0 8px 28px rgba(16, 29, 58, .07);
      border: 1px solid var(--border);
    }

    .section-heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .section-heading h3 {
      color: var(--navy);
      font-size: 23px;
      margin: 0 0 8px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      color: var(--navy);
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7dce6;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(217, 164, 65, .13);
    }

    .hint {
      color: var(--muted);
      font-size: 11px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .primary-btn {
      width: 100%;
      color: var(--navy);
      background: var(--gold);
    }

    .primary-btn:hover { background: var(--gold-light); }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
    }

    .message.error {
      display: block;
      color: var(--red);
      background: #fff0f0;
    }

    .message.success {
      display: block;
      color: var(--green);
      background: #eaf8f1;
    }

    .results-card { display: none; }

    .student-header {
      background: var(--navy);
      color: white;
      padding: 22px;
      border-radius: 11px;
      border-left: 5px solid var(--gold);
      margin-bottom: 22px;
    }

    .student-header h3 {
      margin: 0 0 15px;
      color: var(--gold-light);
      font-size: 20px;
    }

    .student-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .detail-label {
      color: #c4cede;
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .detail-value {
      color: white;
      font-size: 14px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .assessment-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .assessment-bar label { margin: 0; }

    select {
      padding: 11px 14px;
      border: 1px solid #d7dce6;
      border-radius: 8px;
      min-width: 220px;
      font-size: 14px;
      background: white;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 480px;
    }

    th {
      background: var(--navy);
      color: white;
      text-align: left;
      padding: 14px;
      font-size: 12px;
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    tbody tr:last-child td { border-bottom: none; }

    .total-row {
      background: #fff9eb;
      font-weight: bold;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .summary-box {
      background: #f6f7fa;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px 10px;
      text-align: center;
    }

    .summary-box span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .summary-box strong {
      color: var(--navy);
      font-size: 21px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .print-btn {
      flex: 1;
      background: var(--navy);
      color: white;
    }

    .logout-btn {
      background: #edf0f5;
      color: var(--navy);
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 25px 10px;
    }

    footer {
      background: var(--navy);
      color: #d3d9e5;
      text-align: center;
      padding: 22px 12px;
      font-size: 12px;
      line-height: 1.8;
    }

    footer strong { color: var(--gold-light); }

    @media (max-width: 550px) {
      main { margin-top: 20px; }
      .login-card, .results-card { padding: 19px; }
      .student-details { grid-template-columns: 1fr 1fr; }
      .summary { grid-template-columns: 1fr; }
      .assessment-bar { align-items: stretch; }
      select { width: 100%; }
      .action-buttons { flex-direction: column; }
    }

    @media print {
      body { background: white; }
      header { padding: 15px; }
      main { width: 100%; margin: 15px auto; }
      .login-card, footer, .assessment-bar,
      .action-buttons { display: none !important; }
      .results-card {
        display: block !important;
        box-shadow: none;
        border: none;
        padding: 0;
      }
      .student-header {
        background: white;
        color: black;
        border: 1px solid #aaa;
      }
      .student-header h3, .detail-value { color: black; }
      .detail-label { color: #555; }
      th { background: #eee !important; color: black !important; }
      .summary-box { background: white; }
    }
  </style>
</head>

<body>
  <div class="topbar"></div>

  <header>
    <div class="logo">R</div>
    <div class="welcome">WELCOME TO</div>
    <h1>RAAGASREE</h1>
    <h2>E.M HIGH SCHOOL</h2>
    <div class="location">V. KOTA</div>
    <div class="tagline">Excellence in Every Step</div>
  </header>

  <main>
    <section class="login-card" id="loginSection">
      <div class="section-heading">
        <h3>Student Results Portal</h3>
        <p>Academic Year 2026–27</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="hallTicket">Hall Ticket Number</label>
          <input
            id="hallTicket"
            type="text"
            placeholder="Enter your Hall Ticket Number"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input
            id="dob"
            type="text"
            placeholder="DD/MM/YYYY"
            autocomplete="bday"
            required
          >
          <div class="hint">Enter your date of birth in DD/MM/YYYY format.</div>
        </div>

        <button class="primary-btn" id="loginButton" type="submit">
          CHECK MY RESULTS
        </button>
      </form>

      <div class="message" id="loginMessage" role="alert"></div>
    </section>

    <section class="results-card" id="resultsSection">
      <div class="student-header">
        <h3>Student Report</h3>
        <div class="student-details" id="studentDetails"></div>
      </div>

      <div class="assessment-bar">
        <label for="assessmentSelect">Select Assessment</label>
        <select id="assessmentSelect"></select>
      </div>

      <div id="marksArea"></div>

      <div class="summary" id="summaryArea"></div>

      <div class="action-buttons">
        <button class="print-btn" onclick="window.print()">
          PRINT REPORT
        </button>
        <button class="logout-btn" id="logoutButton">
          LOG OUT
        </button>
      </div>
    </section>
  </main>

  <footer>
    <strong>RAAGASREE E.M HIGH SCHOOL</strong><br>
    V. Kota<br>
    <em>Excellence in Every Step</em><br>
    Student Results Portal • 2026–27
  </footer>

  <script>
    const API_URL =
      "https://raagasree-results-api.yeshwanthsai-rys.workers.dev/";

    let currentStudent = null;
    let currentAssessments = [];

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");

    function showMessage(message, type) {
      loginMessage.textContent = message;
      loginMessage.className = "message " + type;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const hallTicket =
        document.getElementById("hallTicket").value.trim();

      const dob =
        document.getElementById("dob").value.trim();

      if (!hallTicket || !dob) {
        showMessage("Please enter your Hall Ticket Number and Date of Birth.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "CHECKING...";
      loginMessage.className = "message";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "getStudentResults",
            hallTicket: hallTicket,
            dob: dob
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Student details not found. Please check your details.");
        }

        if (!result.student || !Array.isArray(result.assessments)) {
          throw new Error("The results server returned an unexpected response.");
        }

        currentStudent = result.student;
        currentAssessments = result.assessments;

        displayStudent();
        displayAssessmentOptions();

        document.getElementById("loginSection").style.display = "none";
        document.getElementById("resultsSection").style.display = "block";

        if (currentAssessments.length) {
          document.getElementById("assessmentSelect").value =
            currentAssessments[0].code;
          displaySelectedAssessment();
        } else {
          document.getElementById("marksArea").innerHTML =
            '<div class="empty-state">No assessment results are available yet.</div>';
          document.getElementById("summaryArea").innerHTML = "";
        }

        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (error) {
        showMessage(error.message || "Unable to connect. Please try again.", "error");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "CHECK MY RESULTS";
      }
    });

    function displayStudent() {
      const s = currentStudent;

      const details = [
        ["Student Name", s.studentName],
        ["Hall Ticket", s.hallTicket],
        ["Father Name", s.fatherName],
        ["Class & Section", [s.className, s.section].filter(Boolean).join(" - ")],
        ["Academic Year", s.academicYear]
      ];

      document.getElementById("studentDetails").innerHTML =
        details.map(([label, value]) => `
          <div>
            <span class="detail-label">${escapeHTML(label)}</span>
            <span class="detail-value">${escapeHTML(value || "—")}</span>
          </div>
        `).join("");
    }

    function displayAssessmentOptions() {
      const select = document.getElementById("assessmentSelect");

      select.innerHTML = currentAssessments.map(a => `
        <option value="${escapeHTML(a.code)}">
          ${escapeHTML(a.name)}
        </option>
      `).join("");
    }

    document.getElementById("assessmentSelect")
      .addEventListener("change", displaySelectedAssessment);

    function displaySelectedAssessment() {
      const selectedCode =
        document.getElementById("assessmentSelect").value;

      const assessment = currentAssessments.find(
        a => String(a.code) === String(selectedCode)
      );

      if (!assessment) return;

      const marks = Array.isArray(assessment.marks)
        ? assessment.marks
        : [];

      let obtained = 0;
      let maximum = 0;

      const rows = marks.map(mark => {
        const score = Number(mark.marks);
        const max = Number(mark.maximum);

        if (Number.isFinite(score)) obtained += score;
        if (Number.isFinite(max)) maximum += max;

        return `
          <tr>
            <td>${escapeHTML(mark.subject)}</td>
            <td>${Number.isFinite(max) ? max : "—"}</td>
            <td>${Number.isFinite(score) ? score : "—"}</td>
            <td>${escapeHTML(mark.remarks || "—")}</td>
          </tr>
        `;
      }).join("");

      const totalObtained = Number.isFinite(Number(assessment.total))
        ? Number(assessment.total)
        : obtained;

      const totalMaximum = Number.isFinite(Number(assessment.maximumTotal))
        ? Number(assessment.maximumTotal)
        : maximum;

      const percentage = totalMaximum > 0
        ? (totalObtained / totalMaximum) * 100
        : 0;

      document.getElementById("marksArea").innerHTML = marks.length
        ? `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Maximum</th>
                  <th>Marks Obtained</th>
                  <th>Remarks</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
                <tr class="total-row">
                  <td>TOTAL</td>
                  <td>${totalMaximum}</td>
                  <td>${totalObtained}</td>
                  <td>—</td>
                </tr>
              </tbody>
            </table>
          </div>
        `
        : '<div class="empty-state">Marks have not been entered for this assessment yet.</div>';

      document.getElementById("summaryArea").innerHTML = `
        <div class="summary-box">
          <span>MARKS OBTAINED</span>
          <strong>${totalObtained}</strong>
        </div>
        <div class="summary-box">
          <span>MAXIMUM MARKS</span>
          <strong>${totalMaximum}</strong>
        </div>
        <div class="summary-box">
          <span>PERCENTAGE</span>
          <strong>${percentage.toFixed(1)}%</strong>
        </div>
      `;
    }

    document.getElementById("logoutButton").addEventListener("click", function() {
      currentStudent = null;
      currentAssessments = [];

      document.getElementById("resultsSection").style.display = "none";
      document.getElementById("loginSection").style.display = "block";

      loginForm.reset();
      loginMessage.className = "message";

      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
